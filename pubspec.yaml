name: driverroute_eta
description: DriverRoute Arrival/ETA – Flutter MVP
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.5.0
  intl: ^0.20.2
  timezone: ^0.9.2
  shared_preferences: ^2.3.2
  google_maps_flutter: ^2.5.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  uuid: ^4.5.1
  share_plus: ^10.1.4
  screenshot: ^3.0.0
  url_launcher: ^6.3.1
  geolocator: ^13.0.2
  web: ^1.1.1
  supabase_flutter: ^2.17.2
  maplibre_gl: ^0.27.1

# optional (später):
# flutter_polyline_points: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fahrplaene/ferries.json
    # Tour-Animation: Ländergrenzen (Natural Earth, gemeinfrei) und Flaggen.
    # Werden erst beim Öffnen der Animation geladen.
    - assets/geo/countries.json
    - assets/flags/
